[project]
name = "analysis"
version = "0.1.0"
description = "Customer analytics for the Nails with Cat booking data (read-only over the Google Sheet)"
readme = "README.md"
authors = [
    { name = "oklahaha", email = "121851232+oklahaha@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client==2.201.0",
    "google-auth==2.62.0",
    "jupyter==1.1.1",
    "lifelines==0.30.3",
    "lifetimes==0.11.3",
    "matplotlib==3.11.2",
    "nbconvert==7.17.2",
    "numpy==2.5.4",
    "pandas==2.3.3",
    "pyarrow==26.0.0",
    "python-dotenv==1.2.4",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
